<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a1c36">
<title>Yeti Sports – Olympiade 8</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1200px 800px at 50% 20%,#14335e,#081426);}
  body{display:flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',sans-serif;}
  #wrap{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.55);
    animation:pop .5s ease-out;background:#3b6fcf;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  canvas{width:100%;height:100%;display:block;touch-action:none;}
  .lean{position:absolute;bottom:6%;width:16%;max-width:130px;aspect-ratio:1;border-radius:50%;
    background:rgba(10,30,60,.4);border:3px solid rgba(255,255,255,.55);color:#fff;font-size:min(9vw,52px);
    display:none;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;z-index:5;}
  #leanL{left:3%;}#leanR{right:3%;}
  .lean:active{background:rgba(80,160,255,.55);}
  #ctrl{position:absolute;right:1.5%;bottom:2.5%;display:flex;gap:8px;z-index:6;}
  #ctrl button{width:min(11vmin,46px);height:min(11vmin,46px);border-radius:50%;border:2px solid rgba(255,255,255,.4);
    background:rgba(10,28,54,.55);color:#fff;font-size:min(5vmin,20px);cursor:pointer;padding:0;line-height:1;}
  #ctrl button.off{opacity:.35;}
  #orient{position:absolute;inset:0;background:rgba(6,16,34,.92);color:#fff;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;font-size:min(7vw,28px);z-index:20;
    font-family:'Bangers','Arial Black',sans-serif;letter-spacing:1px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="leanL" class="lean">◀</div>
  <div id="leanR" class="lean">▶</div>
  <div id="ctrl">
    <button id="btnMusic" title="Musik an/aus">🎵</button>
    <button id="btnSfx" title="Sound an/aus">🔊</button>
    <button id="btnCode" title="Lauf-Code kopieren">📋</button>
    <button id="btnFs" title="Vollbild">⛶</button>
  </div>
  <div id="orient"><div>📱 ➜ 🖥️<br><br>BITTE QUERFORMAT DREHEN!</div></div>
</div>
<script>
'use strict';
/* ================= Setup & Auto-Fit ================= */
const W=960,H=540;
const wrap=document.getElementById('wrap'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TOUCH='ontouchstart' in window;
let viewScale=1;
function resize(){
  const vw=innerWidth,vh=innerHeight;
  let w=vw,h=vw*9/16;
  if(h>vh){h=vh;w=vh*16/9;}
  wrap.style.width=w+'px';wrap.style.height=h+'px';
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.max(2,Math.round(w*dpr));cv.height=Math.max(2,Math.round(h*dpr));
  viewScale=cv.width/W;
  const el=document.getElementById('orient');
  const port=window.matchMedia&&matchMedia('(orientation: portrait)').matches;
  el.style.display=(port&&TOUCH&&innerHeight>innerWidth)?'flex':'none';
}
addEventListener('resize',resize);
document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
resize();
function goFS(){try{const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});return;}
  if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}catch(e){}}

/* ================= Helfer ================= */
if(typeof ctx.roundRect!=='function'){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);
    this.closePath();return this;};}
let now=0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
function ell(x,y,rx,ry,f,s,lw){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,6.2832);
  if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw||3;ctx.stroke();}}
function cir(x,y,r,f,s,lw){ell(x,y,r,r,f,s,lw);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function cap(x1,y1,x2,y2,w,col,out){out=out||'#274b6d';ctx.lineCap='round';
  ctx.strokeStyle=out;ctx.lineWidth=w+4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function setF(size,bang){ctx.font=size+'px '+(bang?"'Bangers','Arial Black',sans-serif":"'Trebuchet MS',sans-serif");}
function txt(s,x,y,size,col,align,bang,lw){
  if(align===undefined)align='center';if(bang===undefined)bang=true;
  setF(size,bang);ctx.textAlign=align;ctx.textBaseline='middle';
  lw=lw===undefined?Math.max(3,size/8):lw;
  if(lw>0){ctx.lineJoin='round';ctx.strokeStyle='rgba(10,28,54,.95)';ctx.lineWidth=lw;ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);}
function starShape(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;
    ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}
  ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(20,40,70,.5)';ctx.lineWidth=2;ctx.stroke();}
let meterPop=0,prevMeter=-1;
function bigMeter(v,x,y,col){if(v>prevMeter+1)meterPop=1;prevMeter=v;
  txt(v+' m',x,y,54*(1+meterPop*.3),col||'#fff');}
function drawTrailPath(pts,rgbaBase){if(pts.length<2)return;
  ctx.lineCap='round';
  for(let i=1;i<pts.length;i++){const t=i/pts.length;
    ctx.strokeStyle=rgbaBase+(t*.45)+')';ctx.lineWidth=2+t*10;
    ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}}
function drawCloudShadows(camX,gy){ctx.fillStyle='rgba(30,60,100,.06)';
  for(let i=0;i<3;i++){const x=camX+((now*14+i*430)%(W+500))-250;
    ctx.beginPath();ctx.ellipse(x,gy+34,95,13,0,0,6.283);ctx.fill();}}

/* ================= FX ================= */
let shake=0,flash=0,zoomFx=0,timeScale=1,slowT=0,freezeT=0,rainbow=false,cheerT=0,bigHead=false,sunClicks=0;
let runPerfects=0,extraPts=0,stolenPts=0;
const addShake=v=>shake=Math.max(shake,v);
function slowmo(){freezeT=.06;timeScale=.32;slowT=.42;}
function cheer(){cheerT=1.4;}
function hopY(){return cheerT>0?Math.abs(Math.sin(now*14))*8:0;}
function addPerf(){runPerfects++;if(runPerfects===3)unlock('hattrick');}
function starburst(x,y){puff(x,y,14,'#ffd23f',280,.6,60);puff(x,y,6,'#ffffff',200,.4,40);}
let rings=[];
function shock(x,y,col){rings.push({x,y,r:10,l:.5,ml:.5,c:col||'#ffd23f'});}
function updRings(dt){for(let i=rings.length-1;i>=0;i--){const r=rings[i];
  r.l-=dt;r.r+=340*dt;if(r.l<=0)rings.splice(i,1);}}
function drawRings(){for(const r of rings){
  ctx.globalAlpha=clamp(r.l/r.ml,0,1)*.8;
  ctx.strokeStyle=r.c;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;}
function updFx(rdt){
  if(slowT>0){slowT-=rdt;if(slowT<=0)timeScale=1;}
  flash=Math.max(0,flash-2.4*rdt);
  zoomFx*=Math.exp(-3*rdt);
  meterPop*=Math.exp(-6*rdt);
  cheerT=Math.max(0,cheerT-rdt);
  shake=Math.max(0,shake-(shake*5+1)*rdt);}

/* ================= Screen-Floats ================= */
let sfloats=[];
function addSFloat(x,y,s,col,size){sfloats.push({x,y,s,col:col||'#fff',size:size||26,l:1.4});}
function updSFloats(rdt){for(let i=sfloats.length-1;i>=0;i--){const f=sfloats[i];
  f.l-=rdt;f.y-=40*rdt;if(f.l<=0)sfloats.splice(i,1);}}
function drawSFloats(){for(const f of sfloats){ctx.globalAlpha=clamp(f.l/.5,0,1);
  txt(f.s,f.x,f.y,f.size,f.col);ctx.globalAlpha=1;}}

/* ================= Waschbär-Dieb ================= */
let rac={on:false,x:W+40,y:H-116,mode:'walk',t:0,stole:false},racT=6;
function resetRaccoon(){rac.on=false;racT=rnd(6,11);}
function updateRaccoon(dt,active){
  if(!active){rac.on=false;return;}
  if(!rac.on){racT-=dt;
    if(racT<=0){rac.on=true;rac.mode='walk';rac.x=W+40;rac.t=0;rac.stole=false;
      rac.y=[H-116,H-126,H-140][evIndex]||H-116;}}
  else{
    if(rac.mode==='walk'){rac.x-=90*dt;
      if(rac.x<W*.55){rac.mode='steal';rac.t=0;}}
    else if(rac.mode==='steal'){rac.t+=dt;
      if(rac.t>2.4){rac.mode='flee';rac.stole=true;stolenPts=10;
        addSFloat(rac.x,rac.y-46,'-10 GEKLAUT!','#ff7b7b',26);
        sfxWhiff();say('DER WASCHBÄR HAT PUNKTE GEKLAUT!');}}
    else if(rac.mode==='flee'){rac.x+=260*dt;
      if(rac.x>W+60){rac.on=false;racT=rnd(8,14);}}}}
function scareRaccoon(){
  if(rac.mode==='steal'){extraPts+=5;
    addSFloat(rac.x,rac.y-46,'+5 VERTRIEBEN!','#7dff9b',26);
    say('VERTRIEBEN! Der Waschbär flieht!');cheer();}
  else{extraPts+=2;addSFloat(rac.x,rac.y-46,'+2','#7dff9b',22);}
  tone(600,.1,'square',.15,900);
  puff(rac.x,rac.y,10,'#8d99a8',200,.4);
  rac.mode='flee';unlock('dieb');}
function drawRaccoon(){
  if(!rac.on)return;
  const bob=evIndex===3?Math.sin(now*2.2)*4:0;
  const x=rac.x,y=rac.y+Math.sin(now*10)*2+bob;
  ctx.save();ctx.translate(x,y);
  if(rac.mode==='flee')ctx.scale(-1,1);
  ctx.strokeStyle='#5a6675';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(16,4);ctx.quadraticCurveTo(34,-6,30,-22);ctx.stroke();
  cir(24,-2,4.5,'#333');cir(30,-11,4.5,'#333');cir(30,-19,4,'#333');
  ell(0,0,20,13,'#8d99a8','#4a5568',2.5);
  cir(-18,-8,11,'#8d99a8','#4a5568',2.5);
  ctx.fillStyle='#8d99a8';ctx.strokeStyle='#4a5568';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-26,-14);ctx.lineTo(-24,-24);ctx.lineTo(-18,-16);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-14,-15);ctx.lineTo(-11,-24);ctx.lineTo(-7,-15);ctx.closePath();ctx.fill();ctx.stroke();
  ell(-22,-9,4,3,'#2a3644');ell(-14,-9,4,3,'#2a3644');
  cir(-22,-9,1.4,'#fff');cir(-14,-9,1.4,'#fff');
  cir(-27,-6,2,'#2a3644');
  const l=Math.sin(now*14)*4;
  ctx.strokeStyle='#4a5568';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-8,10);ctx.lineTo(-8+l,18);ctx.moveTo(8,10);ctx.lineTo(8-l,18);ctx.stroke();
  if(rac.stole){cir(2,-18,9,'#c98a12','#7a4a26',2);txt('$',2,-18,12,'#fff','center',false,0);}
  ctx.restore();
  if(rac.mode==='steal'){
    txt('❗ KLICK!',x,y-44,20,Math.sin(now*8)>0?'#ff7b7b':'#fff');
    ctx.strokeStyle='rgba(255,120,120,'+(.4+.3*Math.sin(now*6))+')';ctx.lineWidth=3;
    ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(x,y,42,0,6.283);ctx.stroke();ctx.setLineDash([]);}}

/* ================= Kommentator ================= */
let cmt={txt:'',t:0,dur:0};
function say(s,dur){cmt={txt:s,t:0,dur:dur||2.8};}
function updCmt(rdt){if(cmt.t<cmt.dur)cmt.t+=rdt;}
function drawCmt(){
  if(!cmt.txt||cmt.t>=cmt.dur)return;
  const n=Math.floor(cmt.t*45),s=cmt.txt.slice(0,n);
  const a=clamp(Math.min((cmt.dur-cmt.t)*3,cmt.t*6),0,1);
  setF(18,true);
  const w=Math.min(ctx.measureText(cmt.txt).width+34,600);
  ctx.globalAlpha=a;
  rr(16,44,w,30,15);ctx.fillStyle='rgba(255,255,255,.93)';ctx.fill();
  ctx.strokeStyle='#274b6d';ctx.lineWidth=2;ctx.stroke();
  txt(s,30,59,18,'#274b6d','left',true,0);
  ctx.globalAlpha=1;}
const INTRO_TALK=[
 ['Willkommen in der Weitschlag-Arena!','Der Pinguin ist bereit. Angeblich.','Achtung: freche Waschbären im Stadion!'],
 ['Robben LIEBEN Anschubser. Sagt man.','Die Eisbahn ist frisch poliert!','Ein Waschbär schleicht herum. Aufpassen!'],
 ['Die Schanze glänzt, das Publikum tobt!','Wind beachten, Springerlein!'],
 ['Die Orcas haben Frühstück gerochen...','Willkommen in der Bucht der Orcas!','Waschbären können sogar schwimmen...'],
 ['Hinter dir: 400 Tonnen Schnee. LOS!','Die Lawine wartet nicht!']];

/* ================= Partikel / Deko ================= */
let parts=[],floats=[],conf=[],toasts=[];
const PMUL=TOUCH?0.6:1;
function puff(x,y,n,col,spd,life,grav){if(parts.length>380)return;
  spd=spd||220;life=life||.5;grav=grav===undefined?300:grav;
  n=Math.round(n*PMUL);
  for(let i=0;i<n;i++){const a=rnd(6.28),s=rnd(.3,1)*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.3,l:life*rnd(.6,1.2),ml:life,c:col,g:grav,r:rnd(2,4.5)});}}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;
  if(p.l<=0){parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}
function drawParts(){for(const p of parts){ctx.globalAlpha=clamp(p.l/p.ml,0,1);
  ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();}ctx.globalAlpha=1;}
function addFloat(x,y,s,col,size){floats.push({x,y,s,col:col||'#fff',size:size||26,l:1.4});}
function updFloats(dt){for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.l-=dt;f.y-=40*dt;if(f.l<=0)floats.splice(i,1);}}
function drawFloats(){for(const f of floats){ctx.globalAlpha=clamp(f.l/.5,0,1);txt(f.s,f.x,f.y,f.size,f.col);ctx.globalAlpha=1;}}
const flakes=[];{const NF=TOUCH?34:64;
  for(let i=0;i<NF;i++)flakes.push({x:rnd(W),y:rnd(H),v:rnd(18,50),r:rnd(1,2.6),ph:rnd(6.28)});}
function updFlakes(dt){for(const f of flakes){f.y+=f.v*dt;f.x+=Math.sin(now+f.ph)*12*dt+8*dt;
  if(f.y>H+4){f.y=-4;f.x=rnd(W);}if(f.x>W+4)f.x=-4;}}
function drawFlakes(){ctx.fillStyle='#fff';
  for(const f of flakes){ctx.globalAlpha=.3+f.r*.2;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;}
const birds=[];for(let i=0;i<3;i++)birds.push({x:rnd(W),y:rnd(50,150),v:rnd(14,26),ph:rnd(6)});
function updBirds(dt){for(const b of birds){b.x-=b.v*dt;if(b.x<-30){b.x=W+30;b.y=rnd(50,150);}}}
function drawBirds(){ctx.strokeStyle='rgba(35,50,80,.6)';ctx.lineWidth=2.5;ctx.lineCap='round';
  for(const b of birds){const f=Math.sin(now*8+b.ph)*4;
    ctx.beginPath();ctx.moveTo(b.x-8,b.y-f);ctx.quadraticCurveTo(b.x-2,b.y+3,b.x,b.y);
    ctx.quadraticCurveTo(b.x+2,b.y+3,b.x+8,b.y-f);ctx.stroke();}}
const balloons=[];{const bcols=['#ff6b6b','#ffd23f','#3ddc84','#4da3ff','#ff9ff3'];
  for(let i=0;i<5;i++)balloons.push({x:80+i*195+rnd(-40,40),v:rnd(18,30),off:rnd(300),ph:rnd(6),c:bcols[i]});}
function drawBalloons(){for(const b of balloons){
  const yy=H+50-((now*b.v+b.off)%(H+160));
  const xx=b.x+Math.sin(now*.8+b.ph)*18;
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(xx,yy+20);ctx.quadraticCurveTo(xx+4,yy+38,xx,yy+54);ctx.stroke();
  ell(xx,yy,15,19,b.c,'rgba(20,40,70,.35)',2);
  ell(xx-5,yy-6,4,6,'rgba(255,255,255,.45)');}}
function drawVignette(){const g=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.9);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,20,50,.22)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
const GRADES=['rgba(120,160,255,.05)','rgba(140,220,255,.06)','rgba(140,90,180,.08)','rgba(255,160,70,.08)'];
function gradeIdx(){if(scene==='event'||scene==='result')return [0,1,2,3,1][evIndex]||0;return 0;}
function drawWindStreaks(w){
  if(Math.abs(w)<15)return;
  ctx.strokeStyle='rgba(255,255,255,.32)';ctx.lineWidth=2.5;ctx.lineCap='round';
  const dir=Math.sign(w),spd=Math.abs(w);
  for(let i=0;i<7;i++){
    const y=70+i*62+Math.sin(now+i*2)*8;
    let x=((now*(spd*6)+i*230)%(W+240))-120;
    if(dir<0)x=W-x;
    const len=26+spd*.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-dir*len,y);ctx.stroke();}}
function updToasts(rdt){for(let i=toasts.length-1;i>=0;i--){toasts[i].t+=rdt;
  if(toasts[i].t>(toasts[i].long?7:2.6))toasts.splice(i,1);}}
function drawToasts(){let yy=84;
  for(const t of toasts){const life=t.long?7:2.6;
    const a=clamp(Math.min(t.t*4,(life-t.t)*2),0,1);
    setF(20,true);const w=ctx.measureText(t.n).width+40;
    const x=W-14-w;
    ctx.globalAlpha=a;
    rr(x,yy,w,32,16);ctx.fillStyle='rgba(20,40,80,.88)';ctx.fill();
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.stroke();
    txt(t.n,x+w/2,yy+16,20,'#ffd23f');
    yy+=40;ctx.globalAlpha=1;}}
function drawFireflies(){for(let i=0;i<12;i++){
  const fx=(i*173+Math.sin(now*.6+i*1.7)*46+W)%W;
  const fy=310+((i*97)%140)+Math.sin(now*1.2+i)*9;
  ctx.globalAlpha=.25+.55*Math.abs(Math.sin(now*2+i*2.4));cir(fx,fy,2,'#ffe89a');}
  ctx.globalAlpha=1;}
function drawSnowman(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ell(0,-8,20,16,'#fff','#9cc3e0',2.5);
  cir(0,-30,13,'#fff','#9cc3e0',2.5);
  cir(0,-44,9,'#fff','#9cc3e0',2.5);
  ctx.fillStyle='#ff9f43';ctx.beginPath();ctx.moveTo(4,-44);ctx.lineTo(14,-42);ctx.lineTo(4,-40);ctx.closePath();ctx.fill();
  cir(-3,-46,1.5,'#222');cir(3,-46,1.5,'#222');
  ctx.fillStyle='#333';ctx.fillRect(-8,-56,16,4);ctx.fillRect(-5,-66,10,10);
  ctx.strokeStyle='#7a4a26';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-13,-26);ctx.lineTo(-30,-38);ctx.moveTo(13,-26);ctx.lineTo(30,-38);ctx.stroke();
  ctx.restore();}

/* ================= Himmel & Welt ================= */
const SKIES=[

function evLawinenSurf(){

              o.done=true;speed=Math.min(speed+80,860);

              puff(o.x,GY-8,10,'#3ddc84',220,.5);

            if(Math.abs(o.x-sx)<(o.type==='rock'?28:32)){

              if(o.type==='rock'&&!o.hit&&o.minY!==undefined&&o.minY<GY-60&&(GY-84-o.minY)<26){
                trickPts+=3;addFloat(sx,yy-70,'KNAPP! +3','#8fd0ff',22);sfxHop();}}}

  const t=STAR_T[evIndex];
  txt('★ ab '+t[0]+'      ★★ ab '+t[1]+'      ★★★ ab '+t[2]+' Punkte',W/2,H/2+48,17,'#ffd23f');
  txt('Bereit machen...',W/2,H/2+80,22,'#7dff9b');}
let panelStarShown=0;
function drawResult(){
  cur.draw();drawRaccoon();
  ctx.fillStyle='rgba(6,18,38,.55)';ctx.fillRect(0,0,W,H);
  const cw=560,ch=400,cx=W/2-cw/2,cy=H/2-ch/2-6;
  rr(cx,cy,cw,ch,22);ctx.fillStyle='rgba(13,34,64,.94)';ctx.fill();
  ctx.strokeStyle='#7fb7e6';ctx.lineWidth=3;ctx.stroke();
  const r=results[results.length-1];
  txt('DISZIPLIN '+results.length+' VON 5 GESCHAFFT!',W/2,cy+36,23,'#8fd0ff');
  txt(cur.name,W/2,cy+72,30,'#fff');
  const shownM=Math.round(r.m*easeOut(resultT/.8));
  txt(shownM+' m',W/2,cy+132,60,'#ffd23f');
  if(r.s>0&&resultT>.5)txt('+ '+r.s+' '+cur.bonusName,W/2,cy+172,22,'#7dff9b');
  const sc=starCount(evIndex,r.pts);
  const starsShown=clamp(Math.floor((resultT-.4)/.22),0,sc);
  if(starsShown>panelStarShown){panelStarShown=starsShown;sfxTick();}
  for(let k=0;k<3;k++){
    const t0=.4+k*.22,pop=clamp((resultT-t0)*5,0,1);
    starShape(W/2-60+k*60,cy+212,21*(k<starsShown?(.6+.4*pop):1),k<starsShown?'#ffd23f':'#33507a');}
  if(newRec)txt('★ NEUER REKORD! ★',W/2,cy+248,24,'#ff9ff3');
  txt('Gesamtpunkte: '+total,W/2,cy+282,25,'#fff');
  if(rival){const rv=rival.res[results.length-1];
    const won=r.pts>=rv.pts;
    txt('🤺 Rivale hier: '+rv.m+' m ('+rv.pts+' P.) → '+(won?'GESCHLAGEN!':'VORNE...')+
      (r.closeB?'  HAUCHDÜNN! +10':''),
      W/2,cy+310,16,won?'#7dff9b':'#ff9f9f');}
  if(results.length<EVENTS.length)
    txt('Als Nächstes: '+evNames[results.length],W/2,cy+334,16,'#8fd0ff','center',false,3);
  if(r.stolen||r.extra>0)
    txt('🦝 Waschbär: '+(r.extra>0?'+'+r.extra+' vertrieben':'-10 geklaut'),
      W/2,cy+352,14,r.extra>0?'#7dff9b':'#ff9f9f');
  if(resultT>.6&&Math.sin(now*4)>-.2)
    txt(results.length<EVENTS.length?'WEITER ➜  (Leertaste)':'ZUR SIEGEREHRUNG ➜',W/2,cy+ch-28,23,'#ffe9a8');}
let fw=[],fwT=1,finalTier=3;
function updFireworks(rdt){fwT-=rdt;
  if(fwT<=0){fwT=finalTier===0?rnd(.6,1.2):rnd(1.2,2);
    fw.push({k:0,x:rnd(140,W-140),y:H,vy:-rnd(420,560),
      c:['#ffd23f','#ff6b6b','#7dff9b','#8fd0ff','#ff9ff3'][Math.floor(rnd(5))]});}
  for(let i=fw.length-1;i>=0;i--){const f=fw[i];
    if(f.k===0){f.y+=f.vy*rdt;f.vy+=260*rdt;
      if(f.vy>-80){fw.splice(i,1);
        for(let j=0;j<26;j++){const a=rnd(6.28),s=rnd(60,240);
          fw.push({k:1,x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.9,ml:.9,c:f.c});}}}
    else{f.l-=rdt;f.vy+=120*rdt;f.x+=f.vx*rdt;f.y+=f.vy*rdt;
      if(f.l<=0)fw.splice(i,1);}}}
function drawFireworks(){ctx.save();ctx.globalCompositeOperation='lighter';
  for(const f of fw){if(f.k===0)cir(f.x,f.y,3,'#fff');
    else{ctx.globalAlpha=clamp(f.l/f.ml,0,1);cir(f.x,f.y,2.6,f.c);}}
  ctx.globalAlpha=1;ctx.restore();}
function updConf(dt){
  if(conf.length<170&&Math.random()<.5)
    conf.push({x:rnd(0,W),y:-20,vy:rnd(60,150),vx:rnd(-30,30),r:rnd(4,9),
      c:['#ffd23f','#ff6b6b','#4da3ff','#3ddc84','#ff9ff3'][Math.floor(rnd(5))],a:rnd(6),va:rnd(-4,4)});
  for(let i=conf.length-1;i>=0;i--){const c=conf[i];
    c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(now*2+c.a)*30*dt;c.a+=c.va*dt;
    if(c.y>H+30)conf.splice(i,1);}}
function drawFinal(){
  drawSky(0);drawClouds(now*20);drawMtns(0);
  ctx.fillStyle='#f2faff';ctx.fillRect(0,445,W,95);sparkles(0,445);
  bunting(40,60,W-40,60);
  drawBalloons();
  const mnames=['GOLDMEDAILLE!','SILBERMEDAILLE!','BRONZEMEDAILLE!','SCHNEEFLOCKE'];
  const cols=[['#ffd23f','#a3720a'],['#d7e3ef','#6f8296'],['#e0a86f','#7a4a26'],['#bfe3ff','#4a7fae']];
  const msg=['Legendär! Du bist der Yeti-König!','Eiskalte Klasse – fast ganz oben!',
             'Respekt, Schneehase!','Dabei sein ist alles – nochmal versuchen!'];
  txt('SIEGEREHRUNG',W/2,30,32,'#fff');
  ctx.save();ctx.translate(W/2,58);
  ctx.fillStyle='#e35d5d';ctx.save();ctx.rotate(-.35);rr(-14,-40,28,86,6);ctx.fill();ctx.restore();
  ctx.fillStyle='#4da3ff';ctx.save();ctx.rotate(.35);rr(-14,-40,28,86,6);ctx.fill();ctx.restore();
  ctx.restore();
  cir(W/2,118,44,cols[finalTier][0],cols[finalTier][1],5);
  cir(W/2,118,30,'rgba(255,255,255,.25)',cols[finalTier][1],2.5);
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(W/2,118,37,now*1.6,now*1.6+.9);ctx.stroke();
  txt(finalTier===3?'❄':(finalTier+1)+'',W/2,118,34,cols[finalTier][1]);
  txt(mnames[finalTier],W/2,180,36,finalTier===0?'#ffd23f':finalTier===1?'#d7e3ef':finalTier===2?'#e0a86f':'#bfe3ff');
  txt(msg[finalTier],W/2,212,19,'#e8f4ff','center',false,4);
  txt('Gesamtpunkte: '+total+(totalRec?'   ★ NEUER REKORD!':''),W/2,244,26,'#fff');
  results.forEach((r,i)=>txt((i+1)+'.  '+evNames[i]+':  '+r.m+' m'+(r.s?'  +'+r.s+' Bonus':'')+'   =  '+r.pts+' P.',
    46,278+i*25,16,'#e8f4ff','left',false,4));
  let bi=0;results.forEach((r,i)=>{if(r.pts>results[bi].pts)bi=i;});
  txt('🔥 Beste Disziplin: '+evNames[bi]+' ('+results[bi].pts+' P.)',46,404,16,'#ffd23f','left',false,3);
  if(rival){const won=total>=rival.total;
    txt('🤺 RIVALE: '+rival.total+' PKT → '+(won?'GESCHLAGEN! 🎉':'HAT GEWONNEN 😤'),
      46,428,16,won?'#7dff9b':'#ff9f9f','left',false,3);}
  txt('👥 Zuschauer heute: '+(500+total*13)+'   ✨ Perfekte Momente: '+runPerfects,46,452,15,'#bfe3ff','left',false,3);
  const pod=(x,h,lab,col)=>{rr(x,508-h,110,h,10);ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle='#274b6d';ctx.lineWidth=3;ctx.stroke();
    txt(lab,x+55,508-h/2,38,'rgba(255,255,255,.9)');};
  pod(560,85,'2','#c9d8e8');pod(668,125,'1','#ffd23f');pod(776,60,'3','#d9a066');
  drawYeti(723,383,{cheer:true,happy:true,sc:.8});
  if(finalTier<3){ctx.strokeStyle=cols[finalTier][1];ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(712,320);ctx.lineTo(723,338);ctx.moveTo(734,320);ctx.lineTo(723,338);ctx.stroke();
    cir(723,346,11,cols[finalTier][0],cols[finalTier][1],2.5);}
  drawPenguin(250,496,Math.sin(now*3)*.12,{s:.9,hat:true});
  drawSeal(350,497,{sq:Math.sin(now*3.3)*.2+.2});
  if(finalTier<=1)drawFireworks();
  for(const c of conf){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
    ctx.fillStyle=c.c;ctx.fillRect(-c.r/2,-c.r/2,c.r,c.r*.6);ctx.restore();}
  txt('CODE: '+lastCode+'   (C oder 📋 = kopieren)',W/2,H-48,15,'#bfe3ff','center',false,3);
  if(Math.sin(now*3.5)>-.3)txt('NOCHMAL SPIELEN  (Leertaste)',W/2,H-26,22,'#ffe9a8');
  txt('Gold ≥ '+MEDAL_T[0]+' · Silber ≥ '+MEDAL_T[1]+' · Bronze ≥ '+MEDAL_T[2],W/2,H-8,12,'rgba(255,255,255,.7)','center',false,3);}

/* ================= Ablauf ================= */
let scene='menu',evIndex=0,results=[],cur=null,resultT=0,total=0,finalT=0,newRec=false,totalRec=false,menuSayT=3;
function startEvent(){cur=EVENTS[evIndex]();scene='event';parts=[];floats=[];rings=[];leanL=leanR=false;prevMeter=-1;
  extraPts=0;stolenPts=0;resetRaccoon();
  sfxRiser();
  const arr=INTRO_TALK[evIndex];say(arr[Math.floor(rnd(arr.length))]);}
function finishEvent(){
  const ptsBase=cur.resM+cur.resS;
  let pts=Math.max(0,ptsBase+extraPts-stolenPts);
  let closeB=false;
  if(rival&&cur.resM>0&&Math.abs(cur.resM-rival.res[evIndex].m)<=5){pts+=10;closeB=true;}
  results.push({m:cur.resM,s:cur.resS,pts,closeB,stolen:stolenPts>0,extra:extraPts});
  total=results.reduce((a,r)=>a+r.pts,0);
  newRec=ptsBase>bests[evIndex]&&ptsBase>0;
  if(ptsBase>bests[evIndex])bests[evIndex]=ptsBase;
  saveBests();panelStarShown=0;
  if(results.length===1)unlock('first');
  if(cur.resM>=150)unlock('weit');
  if(evIndex===4&&cur.resM>=200)unlock('board');
  if(newRec){say('NEUER REKORD! Die Arena tobt!');cheer();}
  scene='result';resultT=0;sfxTick();if(newRec)sfxRecord();}
function next(){evIndex++;
  if(evIndex>=EVENTS.length){
    finalTier=total>=MEDAL_T[0]?0:total>=MEDAL_T[1]?1:total>=MEDAL_T[2]?2:3;
    totalRec=total>bests[4];if(total>bests[4])bests[4]=total;saveBests();
    if(finalTier===0)unlock('gold');
    if(rival&&total>=rival.total)unlock('rivale');
    lastCode=makeCode(results);
    scene='final';finalT=0;conf=[];fw=[];fwT=.5;sfxFanfare();}
  else startEvent();}
let fsTried=false;
function primary(){
  ensureAudio();
  if(!fsTried){fsTried=true;goFS();}
  if(scene==='menu'){runPerfects=0;startEvent();}
  else if(scene==='event'){if(cur.intro>0)cur.intro=0;else if(cur.action)cur.action();}
  else if(scene==='result'){if(resultT>.55)next();}
  else if(scene==='final'){if(finalT>1){results=[];total=0;evIndex=0;conf=[];fw=[];scene='menu';}}}
function update(rdt){
  now+=rdt;updFx(rdt);updClouds(rdt);updBirds(rdt);updFlakes(rdt);updToasts(rdt);updCmt(rdt);updSFloats(rdt);
  let dt=rdt*timeScale;
  if(freezeT>0){freezeT-=rdt;dt=0;}
  updRings(dt);
  musicIntense=scene==='event'&&cur&&!!cur.intense;
  if(musicLP){const target=(timeScale<1||freezeT>0)?420:16000;
    musicLP.frequency.value+=(target-musicLP.frequency.value)*Math.min(1,rdt*6);}
  updParts(dt);updFloats(dt);
  if(scene==='menu'){menuSayT-=rdt;
    if(menuSayT<=0){menuSayT=7;
      const tips=['Tipp: Perfektes Timing gibt Slow-Mo!','Der Yeti trainiert seit 1998 für diesen Tag.',
        'Wusstest du? Pinguine können nicht fliegen. Außer hier.','Fordere Freunde per Rivalen-Code heraus!',
        'Gold-Fische geben +20. Nur so als Info.','Wer die Sonne ärgert, bekommt einen großen Kopf...',
        'Waschbären klauen Punkte – einfach draufklicken!'];
      say(tips[Math.floor(rnd(tips.length))],3);}}
  if(scene==='event'){
    cur.update(dt);
    updateRaccoon(dt,[0,1,3].indexOf(evIndex)>=0&&cur.intro<=0&&!cur.finished);
    if(cur.finished)finishEvent();}
  else if(scene==='result')resultT+=rdt;
  else if(scene==='final'){finalT+=rdt;updConf(rdt);if(finalTier<=1)updFireworks(rdt);}
  const show=(TOUCH&&scene==='event'&&evIndex===2&&cur&&cur.intro<=0);
  const d=show?'flex':'none';bL.style.display=d;bR.style.display=d;}
function render(){
  ctx.setTransform(viewScale,0,0,viewScale,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  if(zoomFx>0.01){ctx.translate(W/2,H/2);ctx.scale(1+zoomFx*.16,1+zoomFx*.16);ctx.translate(-W/2,-H/2);}
  const sp=(scene==='event'&&cur)?(cur.spd||0):0;
  const dz=clamp(sp/16000,0,.06);
  if(dz>0.004){ctx.translate(W/2,H/2);ctx.scale(1-dz,1-dz);ctx.translate(-W/2,-H/2);}
  if(scene==='menu')drawMenu();
  else if(scene==='event'){cur.draw();drawRaccoon();if(cur.intro>0)introCard();}
  else if(scene==='result')drawResult();
  else drawFinal();
  ctx.restore();
  if(timeScale<1){ctx.fillStyle='rgba(4,10,24,.88)';ctx.fillRect(0,0,W,36);ctx.fillRect(0,H-36,W,36);}
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.45)+')';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle=GRADES[gradeIdx()];ctx.fillRect(0,0,W,H);
  drawCmt();drawSFloats();
  drawFlakes();drawToasts();drawVignette();}

/* ================= Input (+ Konami) ================= */
let leanL=false,leanR=false,touchLeanL=false,touchLeanR=false;
const tpointers=new Map();
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA'];
let konI=0;
function recomputeLean(){let l=false,r=false;
  tpointers.forEach(s=>{if(s==='L')l=true;else r=true;});
  touchLeanL=l;touchLeanR=r;}
function leanFromEvent(e){const rect=cv.getBoundingClientRect();
  tpointers.set(e.pointerId,(e.clientX-rect.left)/rect.width<W/2?'L':'R');recomputeLean();}
function toLocal(e){const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
addEventListener('keydown',e=>{
  const c=e.code;
  if(c===KONAMI[konI]){konI++;
    if(konI===KONAMI.length){konI=0;
      if(!rainbow){rainbow=true;toasts.push({n:'🌈 REGENBOGEN-MODUS!',t:0});sfxRecord();}}}
  else if(konI>0)konI=(c===KONAMI[0])?1:0;
  if(c==='ArrowLeft'||c==='KeyA'){leanL=true;e.preventDefault();return;}
  if(c==='ArrowRight'||c==='KeyD'){leanR=true;e.preventDefault();return;}
  if(e.repeat)return;
  if(c==='Space'||c==='Enter'||c==='ArrowUp'||c==='KeyW'){e.preventDefault();primary();}
  else if(c==='KeyR'&&scene==='event')startEvent();
  else if(c==='KeyD'&&scene==='menu')codeDialog();
  else if(c==='KeyC'&&scene==='final')copyCode();});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')leanL=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')leanR=false;});
addEventListener('blur',()=>{leanL=false;leanR=false;});
cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();
  const p=toLocal(e);
  if(scene==='menu'){
    if(Math.hypot(p.x-(W-200),p.y-118)<64){sunClicks++;
      if(sunClicks>=5&&!bigHead){bigHead=true;toasts.push({n:'🗿 GROSSKOPF-MODUS!',t:0});sfxRecord();}
      return;}
    if(p.x>W-310&&p.y>H-52){codeDialog();return;}}
  if(scene==='event'&&rac.on&&Math.hypot(p.x-rac.x,p.y-rac.y)<48){scareRaccoon();return;}
  primary();leanFromEvent(e);});
cv.addEventListener('pointermove',e=>{if(tpointers.has(e.pointerId))leanFromEvent(e);});
['pointerup','pointercancel','pointerleave'].forEach(t=>
  cv.addEventListener(t,e=>{tpointers.delete(e.pointerId);recomputeLean();}));
cv.addEventListener('contextmenu',e=>e.preventDefault());
const bL=document.getElementById('leanL'),bR=document.getElementById('leanR');
function bindLean(el,set){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureAudio();set(true);});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>set(false)));}
bindLean(bL,v=>leanL=v);bindLean(bR,v=>leanR=v);
const btnMusic=document.getElementById('btnMusic'),btnSfx=document.getElementById('btnSfx'),
      btnFs=document.getElementById('btnFs'),btnCode=document.getElementById('btnCode');
btnMusic.addEventListener('pointerdown',e=>{e.stopPropagation();ensureAudio();
  musicOn=!musicOn;btnMusic.classList.toggle('off',!musicOn);
  if(musicOn&&AC)mNext=AC.currentTime+.05;});
btnSfx.addEventListener('pointerdown',e=>{e.stopPropagation();ensureAudio();
  sfxOn=!sfxOn;btnSfx.classList.toggle('off',!sfxOn);});
btnCode.addEventListener('pointerdown',e=>{e.stopPropagation();ensureAudio();copyCode();});
btnFs.addEventListener('pointerdown',e=>{e.stopPropagation();ensureAudio();goFS();});

/* ================= Loop ================= */
let last=performance.now();
function loop(t){const rdt=Math.min(.033,(t-last)/1000);last=t;update(rdt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load)document.fonts.load("40px Bangers");
</script>
