<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a1c36">
<title>Yeti Sports – Olympiade 2</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1200px 800px at 50% 20%,#14335e,#081426);}
  body{display:flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',sans-serif;}
  #wrap{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.55);
    animation:pop .5s ease-out;background:#3b6fcf;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  canvas{width:100%;height:100%;display:block;touch-action:none;}
  .lean{position:absolute;bottom:6%;width:16%;max-width:130px;aspect-ratio:1;border-radius:50%;
    background:rgba(10,30,60,.4);border:3px solid rgba(255,255,255,.55);color:#fff;font-size:min(9vw,52px);
    display:none;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;z-index:5;}
  #leanL{left:3%;}#leanR{right:3%;}
  .lean:active{background:rgba(80,160,255,.55);}
  #ctrl{position:absolute;right:1.5%;bottom:2.5%;display:flex;gap:8px;z-index:6;}
  #ctrl button{width:min(11vmin,46px);height:min(11vmin,46px);border-radius:50%;border:2px solid rgba(255,255,255,.4);
    background:rgba(10,28,54,.55);color:#fff;font-size:min(5vmin,20px);cursor:pointer;padding:0;line-height:1;}
  #ctrl button.off{opacity:.35;}
  #orient{position:absolute;inset:0;background:rgba(6,16,34,.92);color:#fff;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;font-size:min(7vw,28px);z-index:20;
    font-family:'Bangers','Arial Black',sans-serif;letter-spacing:1px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="leanL" class="lean">◀</div>
  <div id="leanR" class="lean">▶</div>
  <div id="ctrl">
    <button id="btnMusic" title="Musik an/aus">🎵</button>
    <button id="btnSfx" title="Sound an/aus">🔊</button>
    <button id="btnFs" title="Vollbild">⛶</button>
  </div>
  <div id="orient"><div>📱 ➜ 🖥️<br><br>BITTE QUERFORMAT DREHEN!</div></div>
</div>
<script>
'use strict';
/* ================= Setup & Auto-Fit ================= */
const W=960,H=540;
const wrap=document.getElementById('wrap'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TOUCH='ontouchstart' in window;
let viewScale=1;
function resize(){
  const vw=innerWidth,vh=innerHeight;
  let w=vw,h=vw*9/16;
  if(h>vh){h=vh;w=vh*16/9;}
  wrap.style.width=w+'px';wrap.style.height=h+'px';
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.max(2,Math.round(w*dpr));cv.height=Math.max(2,Math.round(h*dpr));
  viewScale=cv.width/W;
  const el=document.getElementById('orient');
  const port=window.matchMedia&&matchMedia('(orientation: portrait)').matches;
  el.style.display=(port&&TOUCH&&innerHeight>innerWidth)?'flex':'none';
}
addEventListener('resize',resize);
document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
resize();
function goFS(){try{const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});return;}
  if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}catch(e){}}

/* ================= Helfer ================= */
if(typeof ctx.roundRect!=='function'){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);
    this.closePath();return this;};}
let now=0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
function ell(x,y,rx,ry,f,s,lw){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,6.2832);
  if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw||3;ctx.stroke();}}
function cir(x,y,r,f,s,lw){ell(x,y,r,r,f,s,lw);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function cap(x1,y1,x2,y2,w,col,out){out=out||'#274b6d';ctx.lineCap='round';
  ctx.strokeStyle=out;ctx.lineWidth=w+4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function setF(size,bang){ctx.font=size+'px '+(bang?"'Bangers','Arial Black',sans-serif":"'Trebuchet MS',sans-serif");}
function txt(s,x,y,size,col,align,bang,lw){
  if(align===undefined)align='center';if(bang===undefined)bang=true;
  setF(size,bang);ctx.textAlign=align;ctx.textBaseline='middle';
  lw=lw===undefined?Math.max(3,size/8):lw;
  if(lw>0){ctx.lineJoin='round';ctx.strokeStyle='rgba(10,28,54,.95)';ctx.lineWidth=lw;ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);}
function starShape(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;
    ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}
  ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(20,40,70,.5)';ctx.lineWidth=2;ctx.stroke();}

/* ================= FX ================= */
let shake=0,flash=0,zoomFx=0,timeScale=1,slowT=0;
const addShake=v=>shake=Math.max(shake,v);
function slowmo(){timeScale=.35;slowT=.38;}
function updFx(rdt){
  if(slowT>0){slowT-=rdt;if(slowT<=0)timeScale=1;}
  flash=Math.max(0,flash-2.4*rdt);
  zoomFx*=Math.exp(-3*rdt);
  shake=Math.max(0,shake-(shake*5+1)*rdt);}

/* ================= Partikel, Schnee, Text-Popups ================= */
let parts=[],floats=[],conf=[];
const PMUL=TOUCH?0.6:1;
function puff(x,y,n,col,spd,life,grav){spd=spd||220;life=life||.5;grav=grav===undefined?300:grav;
  n=Math.round(n*PMUL);
  for(let i=0;i<n;i++){const a=rnd(6.28),s=rnd(.3,1)*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.3,l:life*rnd(.6,1.2),ml:life,c:col,g:grav,r:rnd(2,4.5)});}}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;
  if(p.l<=0){parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}
function drawParts(){for(const p of parts){ctx.globalAlpha=clamp(p.l/p.ml,0,1);
  ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();}ctx.globalAlpha=1;}
function addFloat(x,y,s,col,size){floats.push({x,y,s,col:col||'#fff',size:size||26,l:1.4});}
function updFloats(dt){for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.l-=dt;f.y-=40*dt;if(f.l<=0)floats.splice(i,1);}}
function drawFloats(){for(const f of floats){ctx.globalAlpha=clamp(f.l/.5,0,1);txt(f.s,f.x,f.y,f.size,f.col);ctx.globalAlpha=1;}}
const flakes=[];{const NF=TOUCH?38:70;
  for(let i=0;i<NF;i++)flakes.push({x:rnd(W),y:rnd(H),v:rnd(18,50),r:rnd(1,2.6),ph:rnd(6.28)});}
function updFlakes(dt){for(const f of flakes){f.y+=f.v*dt;f.x+=Math.sin(now+f.ph)*12*dt+8*dt;
  if(f.y>H+4){f.y=-4;f.x=rnd(W);}if(f.x>W+4)f.x=-4;}}
function drawFlakes(){ctx.fillStyle='#fff';
  for(const f of flakes){ctx.globalAlpha=.3+f.r*.2;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;}
function drawVignette(){const g=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.9);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,20,50,.22)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

/* ================= Welt-Deko ================= */
const clouds=[];for(let i=0;i<7;i++)clouds.push({x:rnd(0,1400),y:rnd(26,170),s:rnd(.6,1.4),v:rnd(6,18)});
function updClouds(dt){for(const c of clouds)c.x+=c.v*dt;}
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3b6fcf');g.addColorStop(.45,'#7db6ea');g.addColorStop(.72,'#ffd9e6');g.addColorStop(.9,'#fff3e0');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let b=0;b<2;b++){ctx.beginPath();
    for(let x=-20;x<=W+20;x+=16){
      const y=64+b*46+Math.sin(x*.008+now*(.25+b*.15)+b*2.1)*28+Math.sin(x*.023+now*.4+b)*10;
      if(x===-20)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
    ctx.strokeStyle=b===0?'rgba(110,255,190,.16)':'rgba(170,140,255,.13)';
    ctx.lineWidth=36;ctx.lineCap='round';ctx.stroke();}
  const sg=ctx.createRadialGradient(W-200,120,8,W-200,120,150);
  sg.addColorStop(0,'rgba(255,240,190,.9)');sg.addColorStop(.4,'rgba(255,220,160,.35)');sg.addColorStop(1,'rgba(255,220,160,0)');
  ctx.fillStyle=sg;ctx.fillRect(W-360,-30,340,340);
  cir(W-200,120,30,'#fff2cc');}
function drawClouds(par){for(const c of clouds){
  let sx=((c.x-par*c.s*.2)%(W+360));if(sx<-180)sx+=W+360;sx-=180;const s=c.s;
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();
  ctx.ellipse(sx,c.y,42*s,16*s,0,0,6.283);ctx.ellipse(sx+26*s,c.y-10*s,26*s,13*s,0,0,6.283);
  ctx.ellipse(sx-28*s,c.y-6*s,22*s,11*s,0,0,6.283);ctx.fill();}}
function mtn(par,base,amp,col,seed,cy){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-10,H+20);
  for(let sx=-10;sx<=W+10;sx+=6){const wx=sx+par;
    const h=Math.sin(wx*.0021+seed)*.55+Math.sin(wx*.0043+seed*2.3)*.33+Math.sin(wx*.0107+seed*4.1)*.12;
    ctx.lineTo(sx,base-(cy||0)*.35-amp*(.55+.45*h));}
  ctx.lineTo(W+10,H+20);ctx.closePath();ctx.fill();}
function drawMtns(par,cy){mtn(par*.12,370,110,'#d8dcf4',3,cy);mtn(par*.28,420,90,'#bcc6ea',8,cy);}
function tree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#6d4a26';ctx.fillRect(-4,-12,8,14);
  ctx.fillStyle='#2e6e5a';ctx.strokeStyle='#1d4d3f';ctx.lineWidth=2;
  for(let i=0;i<3;i++){const w=46-i*11,yy=-10-i*16;
    ctx.beginPath();ctx.moveTo(0,yy-26);ctx.lineTo(w/2,yy);ctx.lineTo(-w/2,yy);ctx.closePath();ctx.fill();ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.moveTo(0,-62);ctx.lineTo(10,-48);ctx.lineTo(-10,-48);ctx.closePath();ctx.fill();
  ctx.restore();}
function drawTrees(camX,gy,skipA,skipB){
  for(let wx=Math.floor((camX-80)/170)*170;wx<camX+W+80;wx+=170){
    if(skipA!==undefined&&wx>skipA&&wx<skipB)continue;
    const h=Math.abs(Math.sin(wx*12.9898)*43758.5)%1;if(h<0.5)continue;
    tree(wx+(h*60-30),gy,.7+h*.7);}}
function sparkles(camX,gy){for(let wx=Math.floor(camX/60)*60;wx<camX+W+60;wx+=60){
  const h=Math.abs(Math.sin(wx*78.233)*12543.21)%1;
  ctx.globalAlpha=.35+h*.5;cir(wx+h*40,gy+8+h*44,1.3+h,'#fff');}ctx.globalAlpha=1;}
function flatGround(camX,gy,ice){
  const g=ctx.createLinearGradient(0,gy,0,H);
  g.addColorStop(0,ice?'#eef8ff':'#ffffff');g.addColorStop(1,ice?'#cfe6f6':'#e2ecfa');
  ctx.fillStyle=g;ctx.fillRect(camX-60,gy,W+120,H-gy+60);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(camX-60,gy,W+120,5);
  if(ice){ctx.fillStyle='rgba(140,195,235,.4)';
    for(let wx=Math.floor(camX/160)*160;wx<camX+W+160;wx+=160){
      const h=Math.abs(Math.sin(wx*3.71));
      ctx.fillRect(wx,gy+12+h*40,90,4);ctx.fillRect(wx+60,gy+70-h*30,70,3);}}
  sparkles(camX,gy);}
function flag(x,gy,label,col,h){col=col||'#ff6b6b';h=h||48;
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,gy-h);ctx.stroke();
  ctx.fillStyle=col;ctx.strokeStyle='rgba(20,40,70,.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,gy-h);ctx.lineTo(x+30,gy-h+9);ctx.lineTo(x,gy-h+18);ctx.closePath();ctx.fill();ctx.stroke();
  if(label)txt(label,x+3,gy-h-12,17,'#fff');}
function buoy(x,wy,label){
  const b=Math.sin(x*.02+now*2.2)*3,y=wy+b;
  ctx.strokeStyle='rgba(20,40,70,.35)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x,y+6);ctx.lineTo(x,y-30);ctx.stroke();
  cir(x,y-2,9,'#e35d5d','#8f2f2f',2);
  ctx.fillStyle='#fff';ctx.fillRect(x-9,y-6,18,4);
  if(label)txt(label,x,y-42,16,'#fff');}
function bunting(x1,y1,x2,y2){
  ctx.strokeStyle='rgba(40,60,90,.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2,(y1+y2)/2+16,x2,y2);ctx.stroke();
  const cols=['#ff6b6b','#ffd23f','#3ddc84','#4da3ff','#ff9ff3'];
  for(let i=1;i<8;i++){const t=i/8;
    const bx=lerp(x1,x2,t),by=lerp(y1,y2,t)+Math.sin(Math.PI*t)*16;
    ctx.fillStyle=cols[i%5];ctx.beginPath();
    ctx.moveTo(bx-6,by);ctx.lineTo(bx+6,by);ctx.lineTo(bx,by+13);ctx.closePath();ctx.fill();}}
function banner(s){setF(21,true);const w=ctx.measureText(s).width+48;
  rr(W/2-w/2,H-52,w,36,18);ctx.fillStyle='rgba(10,28,54,.78)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke();
  txt(s,W/2,H-34,21,'#fff');}
function HUD(E){
  txt('DISZIPLIN '+(evIndex+1)+'/4 · '+E.name,16,26,20,'#fff','left');
  txt('★ '+total+' Punkte',W-16,26,22,'#ffd23f','right');
  txt('R = neu',W-16,50,13,'rgba(255,255,255,.6)','right',false,3);}

/* ================= Figuren ================= */
function drawArm(sx,sy,ang,len,bat){ctx.save();ctx.translate(sx,sy);ctx.rotate(ang);
  cap(0,0,len,0,15,'#ffffff');cir(len,0,10,'#ffffff','#274b6d',3);
  if(bat){ctx.save();ctx.translate(len,0);ctx.rotate(.5);
    rr(-6,-8,64,16,8);ctx.fillStyle='#c8905a';ctx.fill();ctx.strokeStyle='#7a4a26';ctx.lineWidth=3;ctx.stroke();
    rr(-6,-6,16,12,6);ctx.fillStyle='#8a5a30';ctx.fill();ctx.restore();}
  ctx.restore();}
function drawYeti(x,y,o){o=o||{};ctx.save();ctx.translate(x,y);
  if(o.flip)ctx.scale(-1,1);if(o.sc)ctx.scale(o.sc,o.sc);if(o.lean)ctx.rotate(o.lean);
  const bob=o.jog?Math.sin(now*16)*3:0;ctx.translate(0,bob*.3);
  ell(0,4,50,11,'rgba(25,55,95,.18)');
  const lo=o.jog?Math.sin(now*16)*6:0;
  cap(-16,-40+Math.max(0,lo),-16,-2,17,'#f4f9ff');cap(14,-40+Math.max(0,-lo),14,-2,17,'#f4f9ff');
  ell(-16,0,15,8,'#f4f9ff','#274b6d',3);ell(14,0,15,8,'#f4f9ff','#274b6d',3);
  if(o.cheer){drawArm(-26,-104,-2.4+Math.sin(now*7)*.2,42);drawArm(26,-104,-.7+Math.sin(now*7+2)*.2,42);}
  else{drawArm(-26,-104,o.armL===undefined?1.9:o.armL,40);drawArm(26,-104,o.arm===undefined?-.9:o.arm,46,o.bat);}
  ell(0,-82+bob*.2,45,50,'#ffffff','#274b6d',3.5);ell(8,-76,26,34,'#eaf3fb');
  // Schal
  rr(-22,-120,44,13,6);ctx.fillStyle='#e35d5d';ctx.fill();ctx.strokeStyle='#8f2f2f';ctx.lineWidth=2.5;ctx.stroke();
  ctx.save();ctx.translate(14,-112);ctx.rotate(.35+Math.sin(now*3)*.15);
  rr(-5,0,11,26,5);ctx.fillStyle='#e35d5d';ctx.fill();ctx.stroke();ctx.restore();
  cir(0,-146+bob*.2,35,'#ffffff','#274b6d',3.5);
  cir(-27,-168,8,'#ffffff','#274b6d',3);cir(27,-168,8,'#ffffff','#274b6d',3);
  rr(-21,-158+bob*.2,42,32,14);ctx.fillStyle='#8fa8cc';ctx.fill();ctx.strokeStyle='#274b6d';ctx.lineWidth=3;ctx.stroke();
  if(o.happy){ctx.strokeStyle='#1c2a3a';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(-9,-144,4.5,Math.PI,2*Math.PI);ctx.stroke();
    ctx.beginPath();ctx.arc(9,-144,4.5,Math.PI,2*Math.PI);ctx.stroke();
    ell(0,-133,8,6,'#26324a');ell(0,-131,4,2.5,'#ff8a8a');}
  else{cir(-9,-146,6,'#fff');cir(9,-146,6,'#fff');
    cir(-7.5,-146,2.6,'#1c2430');cir(10.5,-146,2.6,'#1c2430');
    ctx.strokeStyle='#1c2a3a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-136,6,.25,Math.PI-.25);ctx.stroke();}
  cir(0,-139,2.4,'#5c7095');
  ctx.restore();}
function drawPenguin(x,y,rot,o){o=o||{};ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  const s=o.s||1;ctx.scale(s,s);if(o.squash)ctx.scale(1+o.squash*.3,1-o.squash*.3);
  if(o.skis){ctx.save();ctx.translate(-2,20);rr(-30,-2,64,6,3);
    ctx.fillStyle='#ffd23f';ctx.fill();ctx.strokeStyle='#c98a12';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
  ell(0,0,15,19,'#222c3d','#111823',2.5);
  ell(3,4,8.5,12,'#ffffff');
  ell(-13,-1,5,11,'#222c3d','#111823',2);
  cir(7,-9,4.8,'#fff');cir(8.6,-9,2.1,'#131a24');
  ctx.fillStyle='#ff9f43';ctx.strokeStyle='#c96f16';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(13,-7);ctx.lineTo(22,-4);ctx.lineTo(13,-1);ctx.closePath();ctx.fill();ctx.stroke();
  if(o.hat){ctx.fillStyle='#e35d5d';ctx.strokeStyle='#8f2f2f';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-3,-25);ctx.lineTo(3,-25);ctx.lineTo(1.5,-38);ctx.closePath();ctx.fill();ctx.stroke();
    cir(1.5,-39,3.5,'#fff','#c9c9c9',1.5);}
  if(!o.skis){ell(-3,19,5,3,'#ff9f43');ell(7,19,5,3,'#ff9f43');}
  ctx.restore();}
function drawSeal(x,y,o){o=o||{};ctx.save();ctx.translate(x,y);
  if(o.sq)ctx.scale(1+o.sq*.12,1-o.sq*.18);
  ctx.fillStyle='#b6c3d2';ctx.strokeStyle='#5d7285';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-40,4);ctx.lineTo(-58,-8);ctx.lineTo(-50,6);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-40,6);ctx.lineTo(-58,16);ctx.lineTo(-48,10);ctx.closePath();ctx.fill();ctx.stroke();
  ell(0,0,44,17,'#c3cedb','#5d7285',3);ell(6,7,28,8,'#e6edf4');
  cir(36,-11,14,'#c3cedb','#5d7285',3);ell(46,-7,8,6,'#e6edf4');
  cir(51,-11,2.6,'#2a3644');cir(37,-16,3,'#1c2430');cir(38,-17,1,'#fff');
  ctx.strokeStyle='#5d7285';ctx.lineWidth=1.5;ctx.beginPath();

let AC=null,noiseBuf=null,musicOn=true,sfxOn=true,musicStarted=false,mStep=0,mNext=0;
function ensureAudio(){try{

  if(document.hidden)AC.suspend();else AC.resume().catch(()=>{});});
function tone(f,dur,type,vol,f2,delay,music){if(!AC)return;if(!music&&!sfxOn)return;
  type=type||'square';vol=vol||.18;delay=delay||0;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);}
function nz(dur,vol,fq,type,delay,swell,music){if(!AC)return;if(!music&&!sfxOn)return;
  vol=vol||.2;fq=fq||900;type=type||'bandpass';delay=delay||0;
  const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=.9;
  const g=AC.createGain();
  if(swell){g.gain.setValueAtTime(.015,t);g.gain.linearRampToValueAtTime(vol,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0008,t+dur);}
  else{g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);}
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+.05);}

const BPM=132,STEPDUR=60/BPM/2;

const BASSR=[48,45,41,43];
const midiF=n=>440*Math.pow(2,(n-69)/12);
function mNote(f,t,d,type,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function mHat(t,v){if(!AC||!noiseBuf)return;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6500;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+.06);}
function playStep(s,t){
  const bar=s>>3,i=s&7,m=MEL[s];
  if(m)mNote(midiF(m),t,.17,'square',.042);
  if(i===0||i===4){mNote(midiF(BASSR[bar]),t,.24,'triangle',.09);
    const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.1);
    g.gain.setValueAtTime(.11,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.13);}
  mHat(t,(i%2===0)?.016:.009);}

  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;

function evOrcaHop(){
  const WY=400,PPM=20,GRAV=1200;

      if(E.intro>0)return;

          combo++;bestCombo=Math.max(bestCombo,combo);

            py=WY-4;

            else if(hopping){vx*=.93;puff(px,WY-6,8,'#bfe6ff',180,.4,150);sfxPlatsch();}
            vy=0;hopping=false;}
        }
        if(py>=WY-5&&vy===0){ // auf dem Wasser

            dist=Math.max(0,Math.round(px/PPM));
            addFloat(px,WY-90,dist+' m','#ffd23f',46);
            overMsg=(dist>=230?'Orca-Flüsterer!':dist>=150?'Wellenreiter!':dist>=80?'Solide gehüpft!':'Die Orcas warten noch...')+(bestCombo>=3?'  Beste Kombo: ×'+bestCombo:'');
            if(dist>=150)sfxCheer();}}
      }
      else if(st==='over'){finT+=dt;if(finT>1.4&&!E.finished){E.finished=true;E.resM=dist;}}
      camX+=(clamp(px-330,-300,1e9)-camX)*(1-Math.exp(-5*dt));
    },
    draw(){
      drawSky();drawClouds(camX*.15);drawMtns(camX);
      ctx.save();ctx.translate(-camX,0);
      const g=ctx.createLinearGradient(0,WY,0,H);
      g.addColorStop(0,'#3f97d6');g.addColorStop(1,'#1b5d94');
      ctx.fillStyle=g;ctx.fillRect(camX-60,WY,W+120,H-WY+60);

        if(x===camX-60)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}

      for(let x=camX-60;x<camX+W+60;x+=14){const yy=WY+14+Math.sin(x*.017+now*1.7)*4;
        if(x===camX-60)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}

      for(let m=50;m<=400;m+=50)buoy(m*PPM,WY,m+'');
      orcas.forEach(o=>drawOrca(o.x,WY,o));
      const r=py<WY-6?clamp(vy*.0007,-.6,.6):Math.sin(now*3)*.05;
      drawPenguin(px,py,r,{hat:true});
      if(vx>500&&py<WY-10){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;
        for(let i=0;i<4;i++){const yy=py+rnd(-24,24),l=rnd(24,58);
          ctx.beginPath();ctx.moveTo(px-rnd(22,40),yy);ctx.lineTo(px-rnd(22,40)-l,yy);ctx.stroke();}}
      drawParts();drawFloats();
      ctx.restore();
      HUD(E);
      if(st==='run'||st==='over')txt(Math.max(0,Math.round(px/PPM))+' m',W/2,64,54,'#fff');
      if(combo>=2&&st==='run')txt('KOMBO ×'+combo,W/2,116,28+Math.min(combo,8)*2,'#7dff9b');

      const b=st==='ready'?'LEER / Tippe: Rein ins Wasser!':st==='run'?'LEER / Tippe direkt über einem Orca: HÜPFEN!':'';
      if(b)banner(b);
    }};
  return E;}

  scene='result';resultT=0;sfxTick();if(newRec)sfxRecord();}
function next(){evIndex++;
  if(evIndex>=EVENTS.length){scene='final';finalT=0;conf=[];
    totalRec=total>bests[3];if(total>bests[3])bests[3]=total;saveBests();
    sfxFanfare();}
  else startEvent();}
let fsTried=false;
function primary(){
  ensureAudio();
  if(!fsTried){fsTried=true;goFS();}
  if(scene==='menu')startEvent();
  else if(scene==='event'){if(cur.intro>0)cur.intro=0;else if(cur.action)cur.action();}
  else if(scene==='result'){if(resultT>.55)next();}
  else if(scene==='final'){if(finalT>1){results=[];total=0;evIndex=0;conf=[];scene='menu';}}}
function update(rdt){
  now+=rdt;updFx(rdt);updClouds(rdt);updFlakes(rdt);
  const dt=rdt*timeScale;
  updParts(dt);updFloats(dt);
  if(scene==='event'){cur.update(dt);if(cur.finished)finishEvent();}
  else if(scene==='result')resultT+=rdt;
  else if(scene==='final'){finalT+=rdt;updConf(rdt);}
  const show=(TOUCH&&scene==='event'&&evIndex===2&&cur&&cur.intro<=0);
  const d=show?'flex':'none';bL.style.display=d;bR.style.display=d;}
function render(){
  ctx.setTransform(viewScale,0,0,viewScale,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  if(zoomFx>0.01){ctx.translate(W/2,H/2);ctx.scale(1+zoomFx*.16,1+zoomFx*.16);ctx.translate(-W/2,-H/2);}
  if(scene==='menu')drawMenu();
  else if(scene==='event'){cur.draw();if(cur.intro>0)introCard();}
  else if(scene==='result')drawResult();
  else drawFinal();
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.45)+')';ctx.fillRect(0,0,W,H);}
  drawFlakes();drawVignette();}

/* ================= Input ================= */
let leanL=false,leanR=false,touchLeanL=false,touchLeanR=false;
const tpointers=new Map();
function recomputeLean(){let l=false,r=false;
  tpointers.forEach(s=>{if(s==='L')l=true;else r=true;});
  touchLeanL=l;touchLeanR=r;}
function leanFromEvent(e){const rect=cv.getBoundingClientRect();
  tpointers.set(e.pointerId,(e.clientX<rect.left+rect.width/2)?'L':'R');recomputeLean();}
addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA'){leanL=true;e.preventDefault();return;}
  if(c==='ArrowRight'||c==='KeyD'){leanR=true;e.preventDefault();return;}
  if(e.repeat)return;
  if(c==='Space'||c==='Enter'||c==='ArrowUp'||c==='KeyW'){e.preventDefault();primary();}
  else if(c==='KeyR'&&scene==='event')startEvent();});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')leanL=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')leanR=false;});
addEventListener('blur',()=>{leanL=false;leanR=false;});
cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();primary();leanFromEvent(e);});
cv.addEventListener('pointermove',e=>{if(tpointers.has(e.pointerId))leanFromEvent(e);});
['pointerup','pointercancel','pointerleave'].forEach(t=>
  cv.addEventListener(t,e=>{tpointers.delete(e.pointerId);recomputeLean();}));
cv.addEventListener('contextmenu',e=>e.preventDefault());
const bL=document.getElementById('leanL'),bR=document.getElementById('leanR');
function bindLean(el,set){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureAudio();set(true);});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>set(false)));}
bindLean(bL,v=>leanL=v);bindLean(bR,v=>leanR=v);
const btnMusic=document.getElementById('btnMusic'),btnSfx=document.getElementById('btnSfx'),btnFs=document.getElementById('btnFs');
btnMusic.addEventListener('pointerdown',e=>{e.stopPropagation();ensureAudio();
  musicOn=!musicOn;btnMusic.classList.toggle('off',!musicOn);
  if(musicOn&&AC)mNext=AC.currentTime+.05;});
btnSfx.addEventListener('pointerdown',e=>{e.stopPropagation();ensureAudio();
  sfxOn=!sfxOn;btnSfx.classList.toggle('off',!sfxOn);});
btnFs.addEventListener('pointerdown',e=>{e.stopPropagation();ensureAudio();goFS();});

/* ================= Loop ================= */
let last=performance.now();
function loop(t){const rdt=Math.min(.033,(t-last)/1000);last=t;update(rdt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load)document.fonts.load("40px Bangers");
</script>
